name: CI

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}-${{ github.event_name }}
  cancel-in-progress: >-
    ${{
      github.event_name != 'push' ||
      github.ref != 'refs/heads/main' ||
      github.repository != 'movie-reservation-platform-lab/movie-reservation-service'
    }}

jobs:
  service-quality:
    name: service-quality
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Set up Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Check formatting
        run: npm run format:check

      - name: Run lint checks
        run: npm run lint

      - name: Run TypeScript typecheck
        run: npm run typecheck

  automation-quality:
    name: automation-quality
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Set up Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run automation typecheck
        run: npm run typecheck:automation

      - name: Run automation tests
        run: npm run test:automation

  service-unit-tests:
    name: service-unit-tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs:
      - service-quality

    steps:
      - name: Check out repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Set up Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run service unit tests
        run: npm run test:unit

  service-integration-tests:
    name: service-integration-tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs:
      - service-quality

    steps:
      - name: Check out repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Set up Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run service integration tests
        run: npm run test:integration

  # Testcontainers/Postgres e2e remains a separately visible follow-up job.
  service-build:
    name: service-build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs:
      - service-quality

    steps:
      - name: Check out repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Set up Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build service
        run: npm run build

  container-security-check:
    name: container-security-check
    if: >-
      github.event_name != 'push' ||
      github.ref != 'refs/heads/main' ||
      github.repository != 'movie-reservation-platform-lab/movie-reservation-service'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs:
      - automation-quality
      - service-quality
    permissions:
      contents: read

    steps:
      - name: Check out repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version-file: .nvmrc

      - name: Check out reviewed shared security tooling
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          repository: movie-reservation-platform-lab/movie-platform-actions
          ref: 388507380ae9bc2b1ac91282ff16f40d4c65fcfc
          path: .platform-actions
          persist-credentials: false

      - name: Build production image for vulnerability check
        run: docker build --platform linux/amd64 --target runtime --tag movie-reservation-service:local .

      - name: Evaluate complete report with current approved policy
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          node .platform-actions/local-tools/container-security/lib/scan.mjs \
            movie-reservation-service:local \
            --evidence-version v1alpha3 --component reservation-service \
            --output-dir "$RUNNER_TEMP/reservation-service-pr-security"

      - name: Retain PR vulnerability diagnostics
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: reservation-service-pr-vulnerability-report-${{ github.run_id }}-attempt-${{ github.run_attempt }}
          path: ${{ runner.temp }}/reservation-service-pr-security/
          if-no-files-found: error
          retention-days: 14

  publish-candidate:
    name: publish-candidate
    if: >-
      github.event_name == 'push' &&
      github.ref == 'refs/heads/main' &&
      github.repository == 'movie-reservation-platform-lab/movie-reservation-service'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs:
      - automation-quality
      - service-quality
      - service-unit-tests
      - service-integration-tests
      - service-build
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write

    steps:
      - name: Check out repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version-file: .nvmrc

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3

      - name: Prepare candidate publication
        id: image
        uses: movie-reservation-platform-lab/movie-platform-actions/actions/prepare-container-candidate@388507380ae9bc2b1ac91282ff16f40d4c65fcfc
        with:
          component: reservation-service
          github-token: ${{ github.token }}

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish candidate image
        id: publish
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          file: Dockerfile
          target: runtime
          platforms: linux/amd64
          provenance: false
          push: true
          tags: ${{ steps.image.outputs.image_ref }}:${{ steps.image.outputs.tag }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.version=${{ steps.image.outputs.tag }}

      - name: Attest and publish security evidence
        uses: movie-reservation-platform-lab/movie-platform-actions/actions/container-evidence@388507380ae9bc2b1ac91282ff16f40d4c65fcfc
        with:
          evidence-version: v1alpha3
          component: reservation-service
          digest: ${{ steps.publish.outputs.digest }}
          github-token: ${{ github.token }}
