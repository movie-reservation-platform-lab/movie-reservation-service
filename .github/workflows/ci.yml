name: CI

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}-${{ github.event_name }}
  cancel-in-progress: >-
    ${{
      github.event_name != 'push' ||
      github.ref != 'refs/heads/main' ||
      github.repository != 'movie-reservation-platform-lab/movie-reservation-service'
    }}

jobs:
  service-quality:
    name: service-quality
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Set up Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Check formatting
        run: npm run format:check

      - name: Run lint checks
        run: npm run lint

      - name: Run TypeScript typecheck
        run: npm run typecheck

  automation-quality:
    name: automation-quality
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Set up Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run automation typecheck
        run: npm run typecheck:automation

      - name: Run automation tests
        run: npm run test:automation

  service-unit-tests:
    name: service-unit-tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs:
      - service-quality

    steps:
      - name: Check out repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Set up Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run service unit tests
        run: npm run test:unit

  service-integration-tests:
    name: service-integration-tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs:
      - service-quality

    steps:
      - name: Check out repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Set up Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run service integration tests
        run: npm run test:integration

  # Testcontainers/Postgres e2e remains a separately visible follow-up job.
  service-build:
    name: service-build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs:
      - service-quality

    steps:
      - name: Check out repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Set up Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build service
        run: npm run build

  container-security-check:
    name: container-security-check
    if: >-
      github.event_name != 'push' ||
      github.ref != 'refs/heads/main' ||
      github.repository != 'movie-reservation-platform-lab/movie-reservation-service'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs:
      - automation-quality
      - service-quality
    permissions:
      contents: read

    steps:
      - name: Check out repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Set up Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version-file: .nvmrc

      - name: Build local container image
        env:
          DOCKER_DEFAULT_PLATFORM: linux/amd64
        run: npm run docker:build

      - name: Prepare security evidence directory
        run: mkdir -p security-evidence

      - name: Scan local container image
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: image
          image-ref: movie-reservation-service:local
          scanners: vuln
          vuln-type: os,library
          format: json
          output: security-evidence/reservation-service-vulnerabilities.json
          severity: UNKNOWN,LOW,MEDIUM,HIGH,CRITICAL
          ignore-unfixed: false
          hide-progress: true
          exit-code: '0'
          timeout: 5m
          version: v0.70.0

      - name: Evaluate provisional vulnerability policy
        uses: ./.github/actions/evaluate-container-vulnerabilities
        with:
          report-path: security-evidence/reservation-service-vulnerabilities.json
          expected-image: movie-reservation-service:local
          subject-kind: local
          evidence-artifact-name: >-
            reservation-service-pr-vulnerability-report-${{ github.run_id }}-attempt-${{ github.run_attempt }}

      - name: Upload vulnerability report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: >-
            reservation-service-pr-vulnerability-report-${{ github.run_id }}-attempt-${{ github.run_attempt }}
          path: security-evidence/reservation-service-vulnerabilities.json
          if-no-files-found: error
          retention-days: 14

  publish-candidate:
    name: publish-candidate
    if: >-
      github.event_name == 'push' &&
      github.ref == 'refs/heads/main' &&
      github.repository == 'movie-reservation-platform-lab/movie-reservation-service'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs:
      - automation-quality
      - service-quality
      - service-unit-tests
      - service-integration-tests
      - service-build
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write

    steps:
      - name: Check out repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version-file: .nvmrc

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3

      - name: Prepare candidate publication
        id: image
        uses: ./.github/actions/prepare-container-candidate
        with:
          expected-repository: movie-reservation-platform-lab/movie-reservation-service
          expected-ref: refs/heads/main

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish candidate image
        id: publish
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          file: Dockerfile
          platforms: linux/amd64
          provenance: false
          push: true
          tags: ${{ steps.image.outputs.image_ref }}:${{ steps.image.outputs.tag }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.version=${{ steps.image.outputs.tag }}

      - name: Attest published candidate
        id: provenance
        uses: actions/attest-build-provenance@977bb373ede98d70efdf65b84cb5f73e068dcc2a # v3
        with:
          subject-name: ${{ steps.image.outputs.image_ref }}
          subject-digest: ${{ steps.publish.outputs.digest }}
          # Keep provenance in GitHub's attestation API. Registry-hosted
          # attestations create sha256-* fallback tags that GHCR presents as
          # installable container images even though they are not runnable.
          push-to-registry: false

      - name: Retain and verify candidate provenance
        uses: ./.github/actions/verify-container-provenance
        with:
          bundle-path: ${{ steps.provenance.outputs.bundle-path }}
          candidate-image: ${{ steps.image.outputs.image_ref }}@${{ steps.publish.outputs.digest }}
          github-token: ${{ github.token }}
          source-revision: ${{ github.sha }}

      - name: Generate candidate CycloneDX SBOM
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: image
          image-ref: ${{ steps.image.outputs.image_ref }}@${{ steps.publish.outputs.digest }}
          scanners: vuln
          vuln-type: os,library
          format: cyclonedx
          output: security-evidence/reservation-service.cdx.json
          list-all-pkgs: true
          ignore-unfixed: false
          hide-progress: true
          exit-code: '0'
          timeout: 5m
          version: v0.70.0

      - name: Generate candidate vulnerability report
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: image
          image-ref: ${{ steps.image.outputs.image_ref }}@${{ steps.publish.outputs.digest }}
          scanners: vuln
          vuln-type: os,library
          format: json
          output: security-evidence/reservation-service-vulnerabilities.json
          severity: UNKNOWN,LOW,MEDIUM,HIGH,CRITICAL
          ignore-unfixed: false
          hide-progress: true
          exit-code: '0'
          timeout: 5m
          skip-setup-trivy: true
          cache: false

      - name: Evaluate provisional candidate vulnerability policy
        uses: ./.github/actions/evaluate-container-vulnerabilities
        with:
          report-path: security-evidence/reservation-service-vulnerabilities.json
          expected-image: ${{ steps.image.outputs.image_ref }}@${{ steps.publish.outputs.digest }}
          subject-kind: immutable-ghcr
          evidence-artifact-name: >-
            reservation-service-security-evidence-${{ github.run_id }}-attempt-${{ github.run_attempt }}

      - name: Emit candidate evidence contract
        env:
          ATTESTATION_ID: ${{ steps.provenance.outputs.attestation-id }}
          ATTESTATION_URL: ${{ steps.provenance.outputs.attestation-url }}
          CANDIDATE_DIGEST: ${{ steps.publish.outputs.digest }}
          CANDIDATE_REPOSITORY: ${{ steps.image.outputs.image_ref }}
        run: node automation/candidate-evidence/src/emit.mjs

      - name: Attest candidate evidence package
        id: evidence-provenance
        uses: actions/attest-build-provenance@977bb373ede98d70efdf65b84cb5f73e068dcc2a # v3
        with:
          subject-path: |
            security-evidence/component-candidate-evidence-v1alpha1.json
            security-evidence/reservation-service-provenance.json
            security-evidence/reservation-service.cdx.json
            security-evidence/reservation-service-vulnerabilities.json

      - name: Validate candidate handoff metadata
        id: handoff
        uses: ./.github/actions/record-container-candidate
        with:
          artifact-name: reservation-service
          candidate-registry: ${{ steps.image.outputs.registry }}
          candidate-repository: ${{ steps.image.outputs.repository }}
          candidate-image: ${{ steps.image.outputs.image_ref }}
          candidate-tag: ${{ steps.image.outputs.tag }}
          candidate-digest: ${{ steps.publish.outputs.digest }}
          source-repository: ${{ github.repository }}
          source-revision: ${{ github.sha }}
          build-ref: ${{ steps.image.outputs.build_ref }}
          evidence-artifact-name: >-
            reservation-service-security-evidence-${{ github.run_id }}-attempt-${{ github.run_attempt }}
          evidence-contract-path: security-evidence/component-candidate-evidence-v1alpha1.json
          evidence-attestation-url: ${{ steps.evidence-provenance.outputs.attestation-url }}

      - name: Upload candidate security evidence
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ${{ steps.handoff.outputs.evidence_artifact_name }}
          path: |
            ${{ steps.handoff.outputs.evidence_contract_path }}
            security-evidence/reservation-service-provenance.json
            security-evidence/reservation-service.cdx.json
            security-evidence/reservation-service-vulnerabilities.json
          if-no-files-found: error
          retention-days: 14

      - name: Upload rejected candidate diagnostics
        if: ${{ failure() && !cancelled() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: >-
            reservation-service-rejected-security-evidence-${{ github.run_id }}-attempt-${{ github.run_attempt }}
          path: |
            security-evidence/reservation-service.cdx.json
            security-evidence/reservation-service-vulnerabilities.json
          if-no-files-found: warn
          retention-days: 14
