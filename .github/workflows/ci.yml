name: CI

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}-${{ github.event_name }}
  cancel-in-progress: >-
    ${{
      github.event_name != 'push' ||
      github.ref != 'refs/heads/main' ||
      github.repository != 'movie-reservation-platform-lab/movie-reservation-service'
    }}

jobs:
  service-quality:
    name: service-quality
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Set up Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Check formatting
        run: npm run format:check

      - name: Run lint checks
        run: npm run lint

      - name: Run TypeScript typecheck
        run: npm run typecheck

  service-unit-tests:
    name: service-unit-tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs:
      - service-quality

    steps:
      - name: Check out repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Set up Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run service unit tests
        run: npm run test:unit

  service-integration-tests:
    name: service-integration-tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs:
      - service-quality

    steps:
      - name: Check out repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Set up Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run service integration tests
        run: npm run test:integration

  # Testcontainers/Postgres e2e remains a separately visible follow-up job.
  service-build:
    name: service-build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs:
      - service-quality

    steps:
      - name: Check out repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Set up Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build service
        run: npm run build

  container-image-check:
    name: container-image-check
    if: >-
      github.event_name != 'push' ||
      github.ref != 'refs/heads/main' ||
      github.repository != 'movie-reservation-platform-lab/movie-reservation-service'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs:
      - service-quality
      - service-unit-tests
      - service-integration-tests
      - service-build
    permissions:
      contents: read

    steps:
      - name: Check out repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Set up Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version-file: .nvmrc

      - name: Build local container image
        env:
          DOCKER_DEFAULT_PLATFORM: linux/amd64
        run: npm run docker:build

  publish-candidate:
    name: publish-candidate
    if: >-
      github.event_name == 'push' &&
      github.ref == 'refs/heads/main' &&
      github.repository == 'movie-reservation-platform-lab/movie-reservation-service'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs:
      - service-quality
      - service-unit-tests
      - service-integration-tests
      - service-build
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write

    steps:
      - name: Check out repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3

      - name: Prepare candidate publication
        id: image
        uses: ./.github/actions/prepare-container-candidate
        with:
          expected-repository: movie-reservation-platform-lab/movie-reservation-service
          expected-ref: refs/heads/main

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish candidate image
        id: publish
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          file: Dockerfile
          platforms: linux/amd64
          push: true
          tags: ${{ steps.image.outputs.image_ref }}:${{ steps.image.outputs.tag }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.version=${{ steps.image.outputs.tag }}

      - name: Attest published candidate
        uses: actions/attest-build-provenance@977bb373ede98d70efdf65b84cb5f73e068dcc2a # v3
        with:
          subject-name: ${{ steps.image.outputs.image_ref }}
          subject-digest: ${{ steps.publish.outputs.digest }}
          push-to-registry: true

      - name: Record candidate handoff
        uses: ./.github/actions/record-container-candidate
        with:
          artifact-name: reservation-service
          candidate-registry: ${{ steps.image.outputs.registry }}
          candidate-repository: ${{ steps.image.outputs.repository }}
          candidate-image: ${{ steps.image.outputs.image_ref }}
          candidate-tag: ${{ steps.image.outputs.tag }}
          candidate-digest: ${{ steps.publish.outputs.digest }}
          source-repository: ${{ github.repository }}
          source-revision: ${{ github.sha }}
          build-ref: ${{ steps.image.outputs.build_ref }}
